plugins { id 'com.android.application' }
android {
    namespace 'br.com.gustavo.campominado'
    compileSdk 35
    defaultConfig {
        applicationId 'br.com.gustavo.campominado'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }
    signingConfigs {
        teste {
            storeFile rootProject.file('teste.jks')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.teste }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
